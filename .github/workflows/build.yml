name: Build Geode Mod

on:
  pull_request:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Win64

      - name: Upload artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: geode-mod
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: GD Screen Recorder ${{ github.ref_name }}
          body: |
            ## GD Screen Recorder

            Official release of GD Screen Recorder for Geode.

            ### Features
            - In-game gameplay recording for Geometry Dash
            - Hardware-accelerated encoding when available
            - Automatic CPU fallback if GPU encoding is unavailable
            - Separate microphone and game audio tracks
            - Screenshot support and recording indicator

            ### Installation
            1. Install Geode.
            2. Download the `.geode` file attached to this release.
            3. Move it to your `geode/mods` folder.
            4. Place `ffmpeg.exe` in your Geometry Dash folder.
            5. Launch the game.

            ### Hotkeys
            - `F5` — Start / Stop recording
            - `F8` — Cycle microphone device
            - `F9` — Cycle game audio device
            - `F11` — Toggle recording indicator
            - `F12` — Take screenshot
          generate_release_notes: true
          files: |
            ${{ steps.build.outputs.build-output }}/*.geode
          fail_on_unmatched_files: true
          overwrite_files: true
          draft: false
          prerelease: false
