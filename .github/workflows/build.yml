 name: Build Mod

 on: [push, pull_request]

 jobs:
   build:
     name: Build on Windows
     runs-on: windows-latest

     steps:
       - name: Checkout
         uses: actions/checkout@v4

       - name: Build Geode mod
         uses: geode-sdk/build-geode-mod@main

       - name: Upload .geode file
         uses: actions/upload-artifact@v4
         with:
           name: geode-mod
           path: 'build/*.geode'
