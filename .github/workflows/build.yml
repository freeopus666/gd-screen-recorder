name: Build Geode Mod

on:
  pull_request:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Win64

      - name: Debug build output
        shell: pwsh
        run: |
          Write-Host "build-output = ${{ steps.build.outputs.build-output }}"
          Get-ChildItem -Path . -Recurse -Filter *.geode | Select-Object FullName

      - name: Upload artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: geode-mod
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: GD Screen Recorder ${{ github.ref_name }}
          body: |
            ## GD Screen Recorder

            Official release of GD Screen Recorder for Geode.

            ### Installation
            1. Install Geode.
            2. Download the attached `.geode` file from this release.
            3. Move the file to your `geode/mods` folder.
            4. Launch the game.

            ### Notes
            - This release was built automatically from the tagged commit.
            - See the repository README for setup and usage details.
          generate_release_notes: true
          files: |
            ${{ steps.build.outputs.build-output }}
          fail_on_unmatched_files: true
          overwrite_files: true
